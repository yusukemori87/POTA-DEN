name: makistove-items
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 楽天APIで薪ストーブ図鑑の商品画像を取得
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          RAKUTEN_REFERER: ${{ vars.RAKUTEN_REFERER }}
        shell: python
        run: |
          import os, json, time, urllib.request, urllib.parse
          Q = []
          for line in open('makistove/queries.txt', encoding='utf-8').read().splitlines():
              if '|' in line:
                  a, b = line.split('|', 1)
                  Q.append((a.strip(), b.strip()))
          AFF = '57142585.1577c0d6.57142586.3a6608f9'
          ref = os.environ.get('RAKUTEN_REFERER') or ('https://' + os.environ.get('SITE_DOMAIN','yusukemori87.github.io/POTA-DEN').replace('https://','').strip('/') + '/')
          H = {'User-Agent': 'Mozilla/5.0', 'Referer': ref, 'Origin': ref.rstrip('/')}
          EPS = ['https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701',
                 'https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20220601']
          os.makedirs('makistove/img', exist_ok=True)
          path = 'makistove/items.json'
          old = json.load(open(path)) if os.path.exists(path) else []
          byid = {str(x.get('id', x.get('i'))): x for x in old}
          def call(q):
              p = {'applicationId': os.environ['RAKUTEN_APP_ID'], 'accessKey': os.environ.get('RAKUTEN_ACCESS_KEY',''),
                   'affiliateId': AFF, 'keyword': q, 'hits': 5, 'imageFlag': 1, 'availability': 1,
                   'sort': '-reviewCount', 'formatVersion': 2}
              err = None
              for ep in EPS:
                  try:
                      req = urllib.request.Request(ep + '?' + urllib.parse.urlencode(p), headers=H)
                      return json.load(urllib.request.urlopen(req, timeout=30))
                  except Exception as e:
                      err = e
              raise err
          for pid, q in Q:
              rec = {'id': pid, 'q': q, 'cands': []}
              try:
                  js = call(q)
                  for k, it in enumerate(js.get('Items', [])[:3]):
                      imgs = it.get('mediumImageUrls') or []
                      if not imgs: continue
                      u = imgs[0] if isinstance(imgs[0], str) else imgs[0].get('imageUrl')
                      u = u.split('?')[0] + '?_ex=300x300'
                      data = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0'}), timeout=30).read()
                      fn = f'{pid}_{k}.jpg'
                      open('makistove/img/' + fn, 'wb').write(data)
                      rec['cands'].append({'name': it.get('itemName','')[:90], 'url': it.get('affiliateUrl') or it.get('itemUrl'),
                                           'price': it.get('itemPrice'), 'shop': it.get('shopName'), 'img': fn})
              except Exception as e:
                  rec['error'] = str(e)[:200]
              byid[pid] = rec
              print(pid, q, len(rec['cands']), rec.get('error', ''))
              time.sleep(1.1)
          json.dump(list(byid.values()), open(path, 'w'), ensure_ascii=False, indent=1)
      - name: 保存
        run: |
          git config user.name "makistove-bot"
          git config user.email "bot@users.noreply.github.com"
          git add makistove
          git diff --cached --quiet || git commit -m "makistove items $(TZ=Asia/Tokyo date +%F)"
          git push
